[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextlens"
version = "0.1.0"
description = "Zero-dependency context-window estimation, truncation, and budgeting for MCP and LLM tools."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Abhishek Prasad", email = "prasad.abhishek@example.com"},
]
keywords = [
    "context-window",
    "tokens",
    "mcp",
    "truncation",
    "budget",
    "estimator",
    "jsonl",
    "jsonrpc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
bench = []

[project.scripts]
contextlens = "contextlens.__main__:main"

[project.urls]
Homepage = "https://github.com/prasad-a-abhishek/contextlens"
Issues = "https://github.com/prasad-a-abhishek/contextlens/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["contextlens*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "error",
]